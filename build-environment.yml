name: build-env
channels:
  - https://repo.prefix.dev/emscripten-forge-4x
  - conda-forge
dependencies:
  - python
  # Python kernel (optional)
  - jupyterlite-pyodide-kernel==0.8.0
  - ipykernel
  - pip
  - jupyter_server
  - jupyterlite-core
  - jupyterlite-xeus
  # JupyterLab: dark theme
  - jupyterlab-night
  # JupyterLab: Miami nights theme (optional)
  - jupyterlab_miami_nights
