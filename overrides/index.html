<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>JupyterLite Ephemeral</title>
  <script>
    (function() {
      const dbName = 'JupyterLite Storage';
      const req = indexedDB.deleteDatabase(dbName);

      req.onsuccess = function () { console.log("Storage cleared."); };
      req.onerror = function () { console.error("Clear failed."); };
      req.onblocked = function () { console.warn("Clear blocked."); };

      localStorage.clear();
      sessionStorage.clear();
    })();
  </script>
</head>
<body>
  <!-- This automatically forwards to the actual JupyterLab interface -->
  <script>
    window.location.href = './lab/index.html';
  </script>
</body>
</html>
