name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mamba
        uses: mamba-org/setup-micromamba@v1
        with:
          micromamba-version: '1.5.8-0'
          environment-file: build-environment.yml
          cache-environment: true

      - name: Build the JupyterLite site
        shell: bash -l {0}
        run: |
          # 1. Prepare your local context assets
          mkdir -p content
          cp README.md content/

          # 2. Create a separate, isolated WebAssembly guest environment
          micromamba create -y -n emscripten-env --platform=emscripten-wasm32 \
            -c https://prefix.dev \
            -c conda-forge \
            xeus-octave

          # 3. Compile the site passing the clean Wasm guest environment path
          jupyter lite build \
            --base-url /skotssd/DSS-JXOctave/ \
            --contents content \
            --output-dir dist \
            --XeusAddon.prefix="$MAMBA_ROOT_PREFIX/envs/emscripten-env" \
            --XeusAddon.default_channels="https://prefix.dev" \
            --XeusAddon.default_channels="https://prefix.dev"


      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
